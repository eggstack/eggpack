[package]
name = "eggpack-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Producer-side planning, qualification, local finalization, and manifest aggregation for Eggpack"
readme = "README.md"

[lints]
workspace = true

[dependencies]
eggpack-contract = { path = "../eggpack-contract", version = "0.1.0" }
eggpack-manifest = { path = "../eggpack-manifest", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
command-group = "5.0.1"
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.10"
