[package]
name = "eggpack-ci"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-neutral release CI planning and deterministic GitHub Actions rendering"
readme = "README.md"

[lints]
workspace = true

[dependencies]
eggpack-contract = { path = "../eggpack-contract", version = "0.1.0" }
eggpack-core = { path = "../eggpack-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_yaml = "0.9"
eggpack-manifest = { path = "../eggpack-manifest", version = "0.1.0" }
eggpack-bootstrap = { path = "../eggpack-bootstrap", version = "0.1.0" }
eggpack-github = { path = "../eggpack-github", version = "0.1.0" }
tokio = { version = "1", features = ["rt", "macros"] }
