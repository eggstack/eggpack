name: Eggpack candidate builds
'on':
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eggpack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve_tag.outputs.source_sha }}
    timeout-minutes: 60
    steps:
      - name: Resolve and validate immutable release source
        id: resolve_tag
        shell: bash
        env:
          EGGPACK_RELEASE_TAG: "${{ github.ref_name }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "set -euo pipefail\ntag=\"$EGGPACK_RELEASE_TAG\"\nif [ \"${#tag}\" -gt 255 ] || [ -z \"$tag\" ]; then\n  echo 'release tag is empty or oversized' >&2\n  exit 1\nfi\nref=\"refs/tags/$tag\"\ngit check-ref-format \"$ref\"\naskpass=\"$RUNNER_TEMP/eggpack-tag-askpass\"\ncat >\"$askpass\" <<'ASKPASS'\n#!/bin/sh\ncase \"$1\" in\n  *Username*) printf '%s\\n' x-access-token ;;\n  *Password*) printf '%s\\n' \"$EGGPACK_GIT_TOKEN\" ;;\n  *) exit 1 ;;\nesac\nASKPASS\nchmod 700 \"$askpass\"\nrefs=\"$(GIT_ASKPASS=\"$askpass\" GIT_TERMINAL_PROMPT=0 EGGPACK_GIT_TOKEN=\"$GITHUB_TOKEN\" git ls-remote --exit-code \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git\" \"$ref\" \"$ref^{}\")\"\nrm -f -- \"$askpass\"\ndirect=\npeeled=\nwhile IFS=\"$(printf '\\t')\" read -r oid name; do\n  case \"$name\" in\n    \"$ref\") [ -z \"$direct\" ] || { echo 'duplicate tag ref result' >&2; exit 1; }; direct=\"$oid\" ;;\n    \"$ref^{}\") [ -z \"$peeled\" ] || { echo 'duplicate peeled tag result' >&2; exit 1; }; peeled=\"$oid\" ;;\n    *) echo 'unexpected tag resolution result' >&2; exit 1 ;;\n  esac\ndone <<< \"$refs\"\nsource_sha=\"${peeled:-$direct}\"\nif [[ ! \"$source_sha\" =~ ^[0-9a-f]{40}$ ]]; then\n  echo 'tag did not resolve to one full commit OID' >&2\n  exit 1\nfi\nprintf 'source_sha=%s\\n' \"$source_sha\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Check out source
        uses: "actions/checkout@0123456789abcdef0123456789abcdef01234567"
        with:
          ref: "${{ steps.resolve_tag.outputs.source_sha }}"
      - name: Verify frozen source checkout
        shell: bash
        env:
          EGGPACK_EXPECTED_SOURCE_SHA: "${{ steps.resolve_tag.outputs.source_sha }}"
        run: test "$(git rev-parse --verify HEAD^{commit})" = "$EGGPACK_EXPECTED_SOURCE_SHA"

      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 10
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --locked eggpack-cli
          eggpack --version
      - name: Verify checked-out release source
        shell: bash
        run: "'eggpack' 'ci' '_verify-source' '--release-plan' 'plans/release-plan.json'"
      - name: Check Cargo availability
        shell: bash
        run: cargo --version
  build_x86_64_unknown_linux_gnu:
    needs: preflight
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    timeout-minutes: 60
    continue-on-error: false
    steps:
      - name: Check out source
        uses: "actions/checkout@0123456789abcdef0123456789abcdef01234567"
        with:
          ref: "${{ needs.preflight.outputs.source_sha }}"
      - name: Verify frozen source checkout
        shell: bash
        env:
          EGGPACK_EXPECTED_SOURCE_SHA: "${{ needs.preflight.outputs.source_sha }}"
        run: test "$(git rev-parse --verify HEAD^{commit})" = "$EGGPACK_EXPECTED_SOURCE_SHA"

      - name: Set up Rust toolchain
        uses: "dtolnay/rust-toolchain@0123456789abcdef0123456789abcdef01234567"
        with:
          toolchain: "1.89.0"
          targets: "x86_64-unknown-linux-gnu"
      - name: Verify Rust toolchain
        shell: bash
        run: cargo +'1.89.0' --version
      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 10
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --locked eggpack-cli
          eggpack --version
      - name: Verify checked-out release source
        shell: bash
        run: "'eggpack' 'ci' '_verify-source' '--release-plan' 'plans/release-plan.json'"
      - name: Build "x86_64-unknown-linux-gnu / bin0"
        shell: bash
        env:
          CARGO_TARGET_DIR: "${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}"
        run: "'cargo' '+1.89.0' 'build' '--release' '--locked' '--target' 'x86_64-unknown-linux-gnu' '--package' 'eggsact' '--bin' 'bin0'"
      - name: Capture canonical build handoff
        shell: bash
        run: "'eggpack' 'ci' '_capture-build' '--release-plan' 'plans/release-plan.json' '--build-bindings' 'bindings/build.toml' '--target' 'x86_64-unknown-linux-gnu' '--cargo-target-dir' '${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}' '--output-dir' './eggpack-build/build_x86_64_unknown_linux_gnu'"
      - name: Upload canonical build handoff
        uses: "actions/upload-artifact@0123456789abcdef0123456789abcdef01234567"
        with:
          name: "eggpack-build-handoff-x86_64-unknown-linux-gnu"
          path: "./eggpack-build/build_x86_64_unknown_linux_gnu"
          if-no-files-found: error
          retention-days: 7
  qualify_build_x86_64_unknown_linux_gnu:
    needs: [ build_x86_64_unknown_linux_gnu, preflight ]
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    timeout-minutes: 60
    continue-on-error: false
    steps:
      - name: Check out source
        uses: "actions/checkout@0123456789abcdef0123456789abcdef01234567"
        with:
          ref: "${{ needs.preflight.outputs.source_sha }}"
      - name: Verify frozen source checkout
        shell: bash
        env:
          EGGPACK_EXPECTED_SOURCE_SHA: "${{ needs.preflight.outputs.source_sha }}"
        run: test "$(git rev-parse --verify HEAD^{commit})" = "$EGGPACK_EXPECTED_SOURCE_SHA"

      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 10
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --locked eggpack-cli
          eggpack --version
      - name: Verify checked-out release source
        shell: bash
        run: "'eggpack' 'ci' '_verify-source' '--release-plan' 'plans/release-plan.json'"
      - name: Download build handoff
        uses: "actions/download-artifact@0123456789abcdef0123456789abcdef01234567"
        with:
          name: "eggpack-build-handoff-x86_64-unknown-linux-gnu"
          path: "./eggpack-handoff/build_x86_64_unknown_linux_gnu"
      - name: Qualify target
        shell: bash
        run: "'eggpack' 'ci' '_qualify-target' '--contract' 'contracts/release.toml' '--release-plan' 'plans/release-plan.json' '--build-bindings' 'bindings/build.toml' '--qualification-bindings' 'bindings/qualification.toml' '--target' 'x86_64-unknown-linux-gnu' '--candidate-dir' './eggpack-handoff/build_x86_64_unknown_linux_gnu/candidates' '--build-handoff' './eggpack-handoff/build_x86_64_unknown_linux_gnu/build-handoff.json' '--output-dir' './eggpack-qualification/build_x86_64_unknown_linux_gnu'"
      - name: Upload qualification evidence
        uses: "actions/upload-artifact@0123456789abcdef0123456789abcdef01234567"
        with:
          name: "eggpack-evidence-x86_64-unknown-linux-gnu"
          path: "./eggpack-qualification/build_x86_64_unknown_linux_gnu"
          if-no-files-found: error
          retention-days: 7
  required_gate:
    needs: [ qualify_build_x86_64_unknown_linux_gnu, preflight ]
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: "actions/checkout@0123456789abcdef0123456789abcdef01234567"
        with:
          ref: "${{ needs.preflight.outputs.source_sha }}"
      - name: Verify frozen source checkout
        shell: bash
        env:
          EGGPACK_EXPECTED_SOURCE_SHA: "${{ needs.preflight.outputs.source_sha }}"
        run: test "$(git rev-parse --verify HEAD^{commit})" = "$EGGPACK_EXPECTED_SOURCE_SHA"

      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 10
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --locked eggpack-cli
          eggpack --version
      - name: Verify checked-out release source
        shell: bash
        run: "'eggpack' 'ci' '_verify-source' '--release-plan' 'plans/release-plan.json'"
      - name: Download qualification "x86_64-unknown-linux-gnu"
        uses: "actions/download-artifact@0123456789abcdef0123456789abcdef01234567"
        with:
          name: "eggpack-evidence-x86_64-unknown-linux-gnu"
          path: "./eggpack-inputs/x86_64-unknown-linux-gnu"
      - name: Create gate outcome directory
        shell: bash
        run: "mkdir -p './eggpack-gate'"
      - name: Evaluate required qualification gate
        shell: bash
        run: "'eggpack' 'ci' '_evaluate-gate' '--ci-plan' 'plans/release-ci-plan.json' '--inputs-dir' './eggpack-inputs' '--output' './eggpack-gate/gate-outcome.json'"
  aggregate:
    needs: [ required_gate, preflight ]
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: "actions/checkout@0123456789abcdef0123456789abcdef01234567"
        with:
          ref: "${{ needs.preflight.outputs.source_sha }}"
      - name: Verify frozen source checkout
        shell: bash
        env:
          EGGPACK_EXPECTED_SOURCE_SHA: "${{ needs.preflight.outputs.source_sha }}"
        run: test "$(git rev-parse --verify HEAD^{commit})" = "$EGGPACK_EXPECTED_SOURCE_SHA"

      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 10
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --locked eggpack-cli
          eggpack --version
      - name: Verify checked-out release source
        shell: bash
        run: "'eggpack' 'ci' '_verify-source' '--release-plan' 'plans/release-plan.json'"
      - name: Download qualification "x86_64-unknown-linux-gnu"
        uses: "actions/download-artifact@0123456789abcdef0123456789abcdef01234567"
        with:
          name: "eggpack-evidence-x86_64-unknown-linux-gnu"
          path: "./eggpack-inputs/x86_64-unknown-linux-gnu"
      - name: Create finalized release directory
        shell: bash
        run: "mkdir -p './eggpack-finalized'"
      - name: Aggregate and finalize release
        shell: bash
        run: "'eggpack' 'ci' '_aggregate' '--contract' 'contracts/release.toml' '--release-plan' 'plans/release-plan.json' '--ci-plan' 'plans/release-ci-plan.json' '--inputs-dir' './eggpack-inputs' '--output-root' './eggpack-finalized/root' '--output' './eggpack-finalized/summary.json'"
      - name: Upload internal finalized release
        uses: "actions/upload-artifact@0123456789abcdef0123456789abcdef01234567"
        with:
          name: "eggpack-finalized-release"
          path: ./eggpack-finalized
          if-no-files-found: error
          retention-days: 7
  stage:
    needs: [ aggregate, preflight ]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Resolve and validate immutable release source
        id: confirm_tag_source
        shell: bash
        env:
          EGGPACK_RELEASE_TAG: "${{ github.ref_name }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EGGPACK_EXPECTED_SOURCE_SHA: "${{ needs.preflight.outputs.source_sha }}"
        run: "set -euo pipefail\ntag=\"$EGGPACK_RELEASE_TAG\"\nif [ \"${#tag}\" -gt 255 ] || [ -z \"$tag\" ]; then\n  echo 'release tag is empty or oversized' >&2\n  exit 1\nfi\nref=\"refs/tags/$tag\"\ngit check-ref-format \"$ref\"\naskpass=\"$RUNNER_TEMP/eggpack-tag-askpass\"\ncat >\"$askpass\" <<'ASKPASS'\n#!/bin/sh\ncase \"$1\" in\n  *Username*) printf '%s\\n' x-access-token ;;\n  *Password*) printf '%s\\n' \"$EGGPACK_GIT_TOKEN\" ;;\n  *) exit 1 ;;\nesac\nASKPASS\nchmod 700 \"$askpass\"\nrefs=\"$(GIT_ASKPASS=\"$askpass\" GIT_TERMINAL_PROMPT=0 EGGPACK_GIT_TOKEN=\"$GITHUB_TOKEN\" git ls-remote --exit-code \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git\" \"$ref\" \"$ref^{}\")\"\nrm -f -- \"$askpass\"\ndirect=\npeeled=\nwhile IFS=\"$(printf '\\t')\" read -r oid name; do\n  case \"$name\" in\n    \"$ref\") [ -z \"$direct\" ] || { echo 'duplicate tag ref result' >&2; exit 1; }; direct=\"$oid\" ;;\n    \"$ref^{}\") [ -z \"$peeled\" ] || { echo 'duplicate peeled tag result' >&2; exit 1; }; peeled=\"$oid\" ;;\n    *) echo 'unexpected tag resolution result' >&2; exit 1 ;;\n  esac\ndone <<< \"$refs\"\nsource_sha=\"${peeled:-$direct}\"\nif [[ ! \"$source_sha\" =~ ^[0-9a-f]{40}$ ]]; then\n  echo 'tag did not resolve to one full commit OID' >&2\n  exit 1\nfi\nif [ \"$source_sha\" != \"$EGGPACK_EXPECTED_SOURCE_SHA\" ]; then\n  echo 'release tag moved after preflight resolution' >&2\n  exit 1\nfi\n"
      - name: Check out source
        uses: "actions/checkout@0123456789abcdef0123456789abcdef01234567"
        with:
          ref: "${{ needs.preflight.outputs.source_sha }}"
      - name: Verify frozen source checkout
        shell: bash
        env:
          EGGPACK_EXPECTED_SOURCE_SHA: "${{ needs.preflight.outputs.source_sha }}"
        run: test "$(git rev-parse --verify HEAD^{commit})" = "$EGGPACK_EXPECTED_SOURCE_SHA"

      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 10
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --locked eggpack-cli
          eggpack --version
      - name: Verify checked-out release source
        shell: bash
        run: "'eggpack' 'ci' '_verify-source' '--release-plan' 'plans/release-plan.json'"
      - name: Download finalized release
        uses: "actions/download-artifact@0123456789abcdef0123456789abcdef01234567"
        with:
          name: "eggpack-finalized-release"
          path: ./eggpack-finalized
          if-no-files-found: error
      - name: Prepare staging payload
        shell: bash
        run: "'eggpack' 'ci' '_prepare-stage' '--contract' 'contracts/release.toml' '--release-manifest' './eggpack-finalized/release-manifest.json' '--finalized-root' './eggpack-finalized/root' '--github-policy' 'policies/github-draft.json' '--install-policy' 'policies/install.toml' '--output-dir' './eggpack-staging' '--output-payload' './eggpack-staging-payload.json'"
      - name: Stage GitHub draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "'eggpack' 'ci' '_stage-github-draft' '--payload' './eggpack-staging-payload.json' '--github-policy' 'policies/github-draft.json' '--staging-dir' './eggpack-staging' '--output-receipt' './eggpack-staging-receipt.json'"
      - name: Upload staging receipt
        uses: "actions/upload-artifact@0123456789abcdef0123456789abcdef01234567"
        with:
          name: "eggpack-staging-receipt"
          path: ./eggpack-staging-receipt.json
          if-no-files-found: error
          retention-days: 7
