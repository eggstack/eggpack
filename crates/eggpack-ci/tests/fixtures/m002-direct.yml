name: Eggpack candidate builds
'on':
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eggpack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: "actions/checkout@0123456789abcdef0123456789abcdef01234567"
      - name: Check Cargo availability
        shell: bash
        run: cargo --version
  build_x86_64_unknown_linux_gnu:
    needs: preflight
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    timeout-minutes: 60
    continue-on-error: false
    steps:
      - name: Check out source
        uses: "actions/checkout@0123456789abcdef0123456789abcdef01234567"
      - name: Set up Rust toolchain
        uses: "dtolnay/rust-toolchain@0123456789abcdef0123456789abcdef01234567"
        with:
          toolchain: "1.89.0"
          targets: "x86_64-unknown-linux-gnu"
      - name: Verify Rust toolchain
        shell: bash
        run: cargo +'1.89.0' --version
      - name: Build "x86_64-unknown-linux-gnu / bin0"
        shell: bash
        env:
          CARGO_TARGET_DIR: "${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}"
        run: "'cargo' '+1.89.0' 'build' '--release' '--locked' '--target' 'x86_64-unknown-linux-gnu' '--package' 'eggsact' '--bin' 'bin0'"
      - name: Hand off internal candidate bytes
        uses: "actions/upload-artifact@0123456789abcdef0123456789abcdef01234567"
        with:
          name: "eggpack-x86_64-unknown-linux-gnu-direct"
          path: "${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}/x86_64-unknown-linux-gnu/release/bin0"
          if-no-files-found: error
          retention-days: 7
  qualify_build_x86_64_unknown_linux_gnu:
    needs: build_x86_64_unknown_linux_gnu
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: "actions/checkout@0123456789abcdef0123456789abcdef01234567"
      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 10
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --locked -p eggpack-cli
          eggpack --version
      - name: Download build handoff
        uses: "actions/download-artifact@0123456789abcdef0123456789abcdef01234567"
        with:
          name: "eggpack-build-handoff-x86_64-unknown-linux-gnu"
          path: ./eggpack-handoff/build_x86_64_unknown_linux_gnu
      - name: Qualify target
        shell: bash
        run: eggpack ci _qualify-target --target "x86_64-unknown-linux-gnu"
      - name: Upload qualification evidence
        uses: "actions/upload-artifact@0123456789abcdef0123456789abcdef01234567"
        with:
          name: "eggpack-evidence-x86_64-unknown-linux-gnu"
          path: ./eggpack-evidence/build_x86_64_unknown_linux_gnu
          if-no-files-found: error
          retention-days: 7
  required_gate:
    needs: [qualify_build_x86_64_unknown_linux_gnu]
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: "actions/checkout@0123456789abcdef0123456789abcdef01234567"
      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 10
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --locked -p eggpack-cli
          eggpack --version
      - name: Evaluate required qualification gate
        shell: bash
        run: eggpack ci _evaluate-gate
  aggregate:
    needs: required_gate
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: "actions/checkout@0123456789abcdef0123456789abcdef01234567"
      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 10
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --locked -p eggpack-cli
          eggpack --version
      - name: Download all qualification evidence
        uses: "actions/download-artifact@0123456789abcdef0123456789abcdef01234567"
        with:
          pattern: eggpack-evidence-*
          path: ./eggpack-evidence
      - name: Aggregate and finalize release
        shell: bash
        run: eggpack ci _aggregate
      - name: Upload internal finalized release
        uses: "actions/upload-artifact@0123456789abcdef0123456789abcdef01234567"
        with:
          name: "eggpack-finalized-release"
          path: ./eggpack-finalized
          if-no-files-found: error
          retention-days: 7
