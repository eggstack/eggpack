name: Eggpack candidate builds
'on':
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eggpack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: "actions/checkout@0123456789abcdef0123456789abcdef01234567"
      - name: Check Cargo availability
        shell: bash
        run: cargo --version
  build_aarch64_unknown_linux_gnu:
    needs: preflight
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Check out source
        uses: "actions/checkout@0123456789abcdef0123456789abcdef01234567"
      - name: Set up Rust toolchain
        uses: "dtolnay/rust-toolchain@0123456789abcdef0123456789abcdef01234567"
        with:
          toolchain: "1.89.0"
          targets: "aarch64-unknown-linux-gnu"
      - name: Verify Rust and cross tools
        shell: bash
        run: |
          cargo +'1.89.0' --version
          actual="$(cargo zigbuild --version)"
          test "$actual" = 'cargo-zigbuild 0.20.0'
          actual_zig="$(zig version)"
          test "$actual_zig" = '0.14.1'
      - name: Build "aarch64-unknown-linux-gnu / eggsact"
        shell: bash
        env:
          CARGO_TARGET_DIR: "${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}"
        run: "'cargo' '+1.89.0' 'zigbuild' '--release' '--locked' '--target' 'aarch64-unknown-linux-gnu.2.17' '--package' 'eggsact' '--bin' 'eggsact'"
      - name: Hand off internal candidate bytes
        uses: "actions/upload-artifact@0123456789abcdef0123456789abcdef01234567"
        with:
          name: "eggpack-aarch64-unknown-linux-gnu-direct"
          path: "${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}/aarch64-unknown-linux-gnu/release/eggsact"
          if-no-files-found: error
          retention-days: 7
  build_x86_64_unknown_linux_gnu:
    needs: preflight
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    timeout-minutes: 60
    continue-on-error: false
    steps:
      - name: Check out source
        uses: "actions/checkout@0123456789abcdef0123456789abcdef01234567"
      - name: Set up Rust toolchain
        uses: "dtolnay/rust-toolchain@0123456789abcdef0123456789abcdef01234567"
        with:
          toolchain: "stable"
          targets: "x86_64-unknown-linux-gnu"
      - name: Verify Rust toolchain
        shell: bash
        run: cargo +'stable' --version
      - name: Build "x86_64-unknown-linux-gnu / eggsact"
        shell: bash
        env:
          CARGO_TARGET_DIR: "${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}"
        run: "'cargo' '+stable' 'build' '--release' '--locked' '--target' 'x86_64-unknown-linux-gnu' '--package' 'eggsact' '--bin' 'eggsact'"
      - name: Hand off internal candidate bytes
        uses: "actions/upload-artifact@0123456789abcdef0123456789abcdef01234567"
        with:
          name: "eggpack-x86_64-unknown-linux-gnu-direct"
          path: "${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}/x86_64-unknown-linux-gnu/release/eggsact"
          if-no-files-found: error
          retention-days: 7
