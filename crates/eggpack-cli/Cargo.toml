[package]
name = "eggpack-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic Eggpack CLI for CI generation and release orchestration"
readme = "README.md"

[[bin]]
