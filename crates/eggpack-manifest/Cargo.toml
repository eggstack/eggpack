[package]
name = "eggpack-manifest"
# ADR-0006 (Option A) narrowed the published digest acceptance set, so this
# crate carries a version independent of the workspace crates. 0.1.2 is the
# latest published manifest version; the workspace crates are separately at
# 0.1.2 in source and remain unpublished.
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/eggstack/eggpack"
documentation = "https://docs.rs/eggpack-manifest"
description = "Bounded schema-v1 evidence for finalized Eggpack release bytes"
readme = "README.md"
authors = ["David Bowman"]
keywords = ["release", "manifest", "artifact", "integrity"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
