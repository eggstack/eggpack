[package]
name = "eggpack-manifest"
# ADR-0006 (Option A) narrows the published digest acceptance set, so this
# crate carries its own patch version. The workspace version stays 0.1.0 for
# the other six crates; `^0.1.0` dependents resolve 0.1.1 unchanged.
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/eggstack/eggpack"
documentation = "https://docs.rs/eggpack-manifest"
description = "Bounded schema-v1 evidence for finalized Eggpack release bytes"
readme = "README.md"
authors = ["David Bowman"]
keywords = ["release", "manifest", "artifact", "integrity"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
