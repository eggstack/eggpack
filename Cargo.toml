[workspace]
resolver = "2"
members = ["crates/eggpack-contract", "crates/eggpack-manifest", "crates/eggpack-core", "crates/eggpack-bootstrap", "crates/eggpack-ci"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/eggstack/eggpack"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
